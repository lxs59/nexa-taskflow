replicaCount: 2

image:
  repository: nexa/taskflow
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"