apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taskflow
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: taskflow
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8085
  egress: []